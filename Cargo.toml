[package]
name = "pypicacher-rs"
version = "0.1.0"
edition = "2024"
description = "High-performance PyPI caching proxy in Rust with concurrent streaming, LRU disk eviction, and upstream HTTP proxy support"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["http1", "http2"] }
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
hex = "0.4"
http = "1"
humantime = "2"
parking_lot = "0.12"
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls-native-roots",
    "rustls-tls-webpki-roots",
    "http2",
    "stream",
    "gzip",
    "brotli",
    "deflate",
    "socks",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
toml = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["compression-br", "compression-gzip", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
tokio-stream = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
